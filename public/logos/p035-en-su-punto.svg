<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 68" width="340" height="68">
  <defs>
    <style>
      .brand-title { font-family: 'Cormorant Garamond', 'Cinzel', 'Playfair Display', Georgia, serif; font-size: 24px; font-weight: 700; letter-spacing: 0.12em; fill: #16181A; }
      .brand-sub { font-family: 'JetBrains Mono', 'DM Sans', -apple-system, monospace; font-size: 8.5px; font-weight: 600; letter-spacing: 0.22em; fill: #C0392B; }
    </style>
  </defs>
  
  <!-- Emblem Badge -->
  <g transform="translate(6, 4)">
