    <g transform="translate(-2, -4)">
      <circle cx="30" cy="32" r="16" fill="#C0392B"/><circle cx="30" cy="32" r="10" fill="#FFFFFF"/><circle cx="30" cy="32" r="5" fill="#C0392B"/>
    </g>
  </g>
  
  <!-- Typography -->
