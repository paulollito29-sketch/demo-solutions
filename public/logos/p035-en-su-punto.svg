<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 68" width="340" height="68">
  <defs>
    <style>
      .brand-title { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.08em; fill: #16181A; }
      .brand-sub { font-family: 'JetBrains Mono', 'DM Sans', monospace, sans-serif; font-size: 8.5px; font-weight: 600; letter-spacing: 0.18em; fill: #C0392B; }
    </style>
  </defs>
  
  <!-- Emblem Badge -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="56" height="56" rx="12" fill="#F2ECE1" stroke="#C0392B" stroke-width="1.5"/>
    <g transform="translate(-2, -4)">
      <circle cx="30" cy="32" r="16" fill="#C0392B"/><circle cx="30" cy="32" r="10" fill="#FFFFFF"/><circle cx="30" cy="32" r="5" fill="#C0392B"/>
    </g>
  </g>
  
  <!-- Typography with standard system fonts · bulletproof offsets -->
  <g transform="translate(74, 34)">
    <text x="0" y="0" class="brand-title">EN SU PUNTO</text>
    <text x="1" y="16" class="brand-sub">CEVICHERÍA · LA VICTORIA</text>
