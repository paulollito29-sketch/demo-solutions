      .brand-title { font-family: 'Cormorant Garamond', 'Cinzel', 'Playfair Display', Georgia, serif; font-size: 24px; font-weight: 700; letter-spacing: 0.12em; fill: #141311; }
      .brand-sub { font-family: 'JetBrains Mono', 'DM Sans', -apple-system, monospace; font-size: 8.5px; font-weight: 600; letter-spacing: 0.22em; fill: #9C712B; }
