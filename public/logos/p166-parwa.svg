<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 68" width="340" height="68">
  <defs>
    <style>
      .brand-title { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.08em; fill: #1C1418; }
      .brand-sub { font-family: 'JetBrains Mono', 'DM Sans', monospace, sans-serif; font-size: 8.5px; font-weight: 600; letter-spacing: 0.18em; fill: #732645; }
